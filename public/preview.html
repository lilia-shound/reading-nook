<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共读小屋 · 皮肤总览（19 套）</title>
<style>
  body {
    margin: 0; padding: 28px 22px 60px;
    background: #12121a; color: #e8e8f0;
    font-family: "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 24px; color: #9aa; font-size: .88rem; line-height: 1.7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card { border-radius: 14px; overflow: hidden; border: 1px solid #2a2a36; background: #1a1a24; }
  .card__head { display: flex; align-items: center; gap: 9px; padding: 9px 12px; background: #1e1e2a; font-size: .82rem; }
  .card__head b { font-weight: 600; }
  .card__head span { color: #8a8a9a; font-size: .74rem; margin-left: auto; }
  .swatchrow { display: flex; gap: 0; height: 8px; }
  .swatchrow i { flex: 1; }
  .mock { padding: 14px 15px 16px; }
  .mock__bar { height: 12px; border-radius: 4px; margin-bottom: 11px; }
  .mock__line { height: 7px; border-radius: 3px; margin-bottom: 7px; }
  .mock__hl { height: 7px; border-radius: 3px; margin-bottom: 7px; }
  .mock__btns { display: flex; gap: 7px; margin-top: 12px; }
  .mock__btns i { height: 20px; border-radius: 5px; }
  .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #2a2a36; }
  .mode > div { padding: 12px 13px 15px; }
  .mode .lbl { font-size: .68rem; color: #7a7a8a; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>共读小屋 · 皮肤总览</h1>
<p class="sub">19 套皮肤，每套左「白天」右「夜间」。色块 = 顶栏 / 纸面 / 正文 / 划线 / 强调 / 气泡。</p>
<div class="grid" id="grid"></div>
<script>
// 主题清单：slug, 中文名, emoji, 分组
const THEMES = [
  ['cream-dog','奶油小狗','🐶','温柔系'], ['matcha','抹茶老铺','🍵','温柔系'],
  ['muxia','慕夏花神','🌸','温柔系'], ['french-blue','法式蓝笺','💌','温柔系'],
  ['mono-sweet','黑白甜','🎀','温柔系'],
  ['clay','黏土','🧱','拟态系'], ['neumorph','新拟物','🫧','拟态系'],
  ['glass','拟态玻璃','🪟','拟态系'], ['liquid-glass','液态玻璃','💧','拟态系'],
  ['skeuomorph','拟物化','🎛️','拟态系'],
  ['material-design','材质设计','📐','现代系'], ['bauhaus','包豪斯','🔺','现代系'],
  ['flat-design','扁平化','▭','现代系'], ['minimalism','极简','◻️','现代系'],
  ['neo-brutalism','新粗野','🧱','粗野系'], ['brutalism','粗野主义','⛓️','粗野系'],
  ['anti-design','反设计','🖍️','粗野系'],
  ['acid-graphics','酸性设计','🧪','赛博系'], ['retrofuturism','复古未来','🛸','赛博系']
];

// 把每个主题的 CSS 都读进来，量出实际颜色
const grid = document.getElementById('grid');

function hexToRgb(h){
  h = h.trim();
  if (h[0] !== '#') return null;
  if (h.length === 4) h = '#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
}
function lum(rgb){
  const f = v => { v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
}
function mix(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
function toHex(rgb){ return '#'+rgb.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); }

async function loadTheme(slug){
  try {
    const res = await fetch('themes/'+slug+'.css');
    if (!res.ok) return null;
    const css = await res.text();
    const out = {};
    for (const mode of ['day','night']){
      const key = 'data-theme="'+slug+'"][data-mode="'+mode+'"';
      const i = css.indexOf(key);
      if (i<0) continue;
      const block = css.slice(i, css.indexOf('}', i));
      const vars = {};
      block.split(';').forEach(d=>{
        const m = /(--[a-z0-9-]+)\s*:\s*([^;]+)/i.exec(d);
        if (m) vars[m[1]] = m[2].trim();
      });
      out[mode] = vars;
    }
    return out;
  } catch(e){ return null; }
}

(async function(){
  for (const [slug, name, emoji, group] of THEMES){
    const vars = await loadTheme(slug);
    if (!vars){ continue; }
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card__head';
    head.innerHTML = '<b>'+emoji+' '+name+'</b><span>'+group+'</span>';
    card.appendChild(head);

    const mode = document.createElement('div');
    mode.className = 'mode';
    for (const m of ['day','night']){
      const v = vars[m] || {};
      const bg = hexToRgb(v['--bg']) || [20,20,26];
      const paper = hexToRgb(v['--paper']) || [255,255,255];
      const ink = hexToRgb(v['--text-color'] || v['--ink']) || [0,0,0];
      const acc = hexToRgb(v['--accent']) || ink;
      const hl = hexToRgb(v['--hl-mine']) || acc;
      const bub = hexToRgb(v['--bub-mine']) || paper;

      const box = document.createElement('div');
      box.style.background = toHex(bg);
      box.innerHTML =
        '<div class="lbl">'+(m==='day'?'白天':'夜间')+'</div>' +
        '<div class="mock" style="background:'+toHex(paper)+';border-radius:8px">' +
          '<div class="mock__bar" style="background:'+toHex(mix(paper,ink,.85))+';width:52%"></div>' +
          '<div class="mock__line" style="background:'+toHex(mix(paper,ink,.72))+';width:100%"></div>' +
          '<div class="mock__hl" style="background:'+toHex(hl)+';width:62%"></div>' +
          '<div class="mock__line" style="background:'+toHex(mix(paper,ink,.72))+';width:92%"></div>' +
          '<div class="mock__line" style="background:'+toHex(mix(paper,ink,.72))+';width:76%"></div>' +
          '<div class="mock__btns">' +
            '<i style="flex:1;background:'+toHex(acc)+'"></i>' +
            '<i style="flex:1;background:'+toHex(bub)+';border:1px solid '+toHex(mix(paper,ink,.3))+'"></i>' +
          '</div>' +
        '</div>';

      const sw = document.createElement('div');
      sw.className = 'swatchrow';
      [bg, paper, ink, hl, acc, bub].forEach(c=>{
        const i2 = document.createElement('i');
        i2.style.background = toHex(c);
        sw.appendChild(i2);
      });
      box.appendChild(sw);
      mode.appendChild(box);
    }
    card.appendChild(mode);
    grid.appendChild(card);
  }
})();
</script>
</body>
</html>
